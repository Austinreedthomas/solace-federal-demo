<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Get satellite alerts to the right people on the ground."><title>Get satellite alerts to the right people on the ground.</title><defs><marker id="deck-arrow-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8FE3DA"/></marker><marker id="deck-arrow-1-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#102E43"/></marker></defs><rect x="0" y="0" width="1600" height="900" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2" stroke-dasharray=""/><text x="80" y="104" fill="#087F83" font-family="Liberation Sans" font-size="22" font-weight="bold"><tspan x="80" dy="0">SPACE SITUATIONAL AWARENESS / EVENT INTEGRATION</tspan></text><text x="80" y="257" fill="#102E43" font-family="Liberation Sans" font-size="70" font-weight="bold"><tspan x="80" dy="0">Get satellite alerts</tspan><tspan x="80" dy="79.1">to the right people</tspan><tspan x="80" dy="79.1">on the ground.</tspan></text><text x="83" y="560" fill="#526A78" font-family="Liberation Sans" font-size="30" font-weight="normal"><tspan x="83" dy="0">The mission challenge: launch alerts start in a</tspan><tspan x="83" dy="41.4">cloud environment, but the ground systems that act</tspan><tspan x="83" dy="41.4">on them run in a separate one.</tspan></text><text x="83" y="722" fill="#102E43" font-family="Liberation Sans" font-size="28" font-weight="bold"><tspan x="83" dy="0">Austin Thomas</tspan></text><text x="83" y="761" fill="#526A78" font-family="Liberation Sans" font-size="23" font-weight="normal"><tspan x="83" dy="0">Solutions Engineer, Solace</tspan></text><rect x="1090" y="0" width="510" height="900" rx="0" fill="#102E43" stroke="none" stroke-width="2" stroke-dasharray=""/><text x="1150" y="128" fill="#8FE3DA" font-family="Liberation Sans" font-size=