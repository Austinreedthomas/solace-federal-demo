an><tspan x="1150" dy="34.8">Only to authorized systems</tspan><tspan x="1150" dy="34.8">Without custom links</tspan></text><text x="1478" y="856" fill="#8FE3DA" font-family="Liberation Sans" font-size="22" font-weight="normal"><tspan x="1478" dy="0">01</tspan></text></svg>
