<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="What we'll show today: controlled access, reliable delivery, less custom integration"><title>What we'll show today: controlled access, reliable delivery, less custom integration</title><defs><marker id="deck-arrow-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#087F83"/></marker><marker id="deck-arrow-2-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#102E43"/></marker></defs><rect x="0" y="0" width="1600" height="900" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2" stroke-dasharray=""/><text x="80" y="91" fill="#087F83" font-family="Liberation Sans" font-size="22" font-weight="bold"><tspan x="80" dy="0">WHAT SUCCESS LOOKS LIKE</tspan></text><text x="80" y="160" fill="#102E43" font-family="Liberation Sans" font-size="51" font-weight="bold"><tspan x="80" dy="0">What we'll show today</tspan></text><text x="80" y="310" fill="#087F83" font-family="Liberation Sans" font-size="72" font-weight="bold"><tspan x="80" dy="0">01</tspan></text><path d="M80 348H520" fill="none" stroke="#B4C9CC" stroke-width="1" stroke-dasharray=""/><text x="80" y="408" fill="#102E43" font-family="Liberation Sans" font-size="33" font-weight="bold"><tspan x="80" dy="0">Controlled access</tspan></text><text x="80" y="458" fill="#526A78" font-family="Liberation Sans" font-size="27" font-weight="normal"><tspan x="80" dy="0">Only approved people and</tspan><tspan x="80" dy="38.3">systems receive the alert.</tspan></text><rect x="80" y="574" width="440" height="166" rx="4" fill="#EDF6F5" stroke="none" stroke-width="2" stroke-dasharray=""/><text x="102" y="614" fill="#087F83" font-family="Liberation Sans" font-size="20" font-weight="bold"><tspan x="102" dy="0">WHAT WE WILL SHOW</tspan></text><text x="102" y="654" fill="#102E43" font-family="Liberation Sans" font-size="24" font-weight="normal"><tspan x="102" dy="0">Permitted consumer receives;</tspan><tspan x="102" dy="33.1">unpermitted publish and</tspan><tspan x="102" dy="33.1">subscribe attempts are denied.</tspan></text><text x="575" y="310" fill="#087F83" font-family="Liberation Sans" font-size="72" font-weight="bold"><tspan x="575" dy="0">02</tspan></text><path d="M575 348H1015" fill="none" stroke="#B4C9CC" stroke-width="1" stroke-dasharray=""/><text x="575" y="408" fill="#102E43" font-family="Liberation Sans" font-size="33" font-weight="bold"><tspan x="575" dy="0">Reliable delivery</tspan></text><text x="575" y="458" fill="#526A78" font-family="Liberation Sans" font-size="27" font-weight="normal"><tspan x="575" dy="0">Important alerts wait when</tspan><tspan x="575" dy="38.3">an operator or system</tspan><tspan x="575" dy="38.3">is offline.</tspan></text><rect x="575" y="574" width="440" height="166" rx="4" fill="#EDF6F5" stroke="none" stroke-width="2" stroke-dasharray=""/><text x="597" y="614" fill="#087F83" font-family="Liberation Sans" font-size="20" font-weight="bold"><tspan x="597" dy="0">WHAT WE WILL SHOW</tspan></text><text x="597" y="654" fill="#102E43" font-family="Liberation Sans" font-size="24" font-weight="normal"><tspan x="597" dy="0">A service goes down;</tspan><tspan x="597" dy="33.1">queued alerts are delivered</tspan><tspan x="597" dy="33.1">when it reconnects.</tspan></text><text x="1070" y="310" fill="#087F83" font-family="Liberation Sans" font-size="72" font-weight="bold"><tspan x="1070" dy="0">03</tspan></text><path d="M1070 348H1510" fill="none" stroke="#B4C9CC" stroke-width="1" stroke-dasharray=""/><text x="1070" y="408" fill="#102E43" font-family="Liberation Sans" font-size="33" font-weight="bold"><tspan x="1070" dy="0">Less custom integration</tspan></text><text x="1070" y="458" fill="#526A78" font-family="Liberation Sans" font-size="27" font-weight="normal"><tspan x="1070" dy="0">New recipients can be added</tspan><tspan x="1070" dy="38.3">without building another</tspan><tspan x="1070" dy="38.3">custom connection.</tspan></text><rect x="1070" y="574" width="440" height="166" rx="4" fill="#EDF6F5" stroke="none" stroke-width="2" stroke-dasharray=""/><text x="1092" y="614" fill="#087F83" font-family="Liberation Sans" font-size="20" font-weight="bold"><tspan x="1092" dy="0">WHAT WE WILL SHOW</tspan></text><text x="1092" y="654" fill="#102E43" font-family="Liberation Sans" font-size="24" font-weight="normal"><tspan x="1092" dy="0">Add a consumer with only</tspan><tspan x="1092" dy="33.1">subscription and access</tspan><tspan x="1092" dy="33.1">changes; producer unchanged.</tspan></text><path d="M80 819H1520" fill="none" stroke="#526A78" stroke-width="1" stroke-dasharray=""/><text x="1468" y="856" fill="#526A78" font-family="Liberation Sans" font-size="22" font-weight="normal"><tspan x="1468" dy="0">02</tspan></text></svg>