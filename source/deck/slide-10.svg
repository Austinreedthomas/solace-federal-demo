<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Prove the business value in your environment."><title>Prove the business value in your environment.</title><defs><marker id="deck-arrow-10" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#087F83"/></marker><marker id="deck-arrow-10-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#102E43"/></marker></defs><rect x="0" y="0" width="1600" height="900" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2" stroke-dasharray=""/><rect x="0" y="0" width="570" height="900" rx="0" fill="#102E43" stroke="none" stroke-width="2" stroke-dasharray=""/><text x="80" y="105" fill="#8FE3DA" font-family="Liberation Sans" font-size="22" font-weight="bold"><tspan x="80" dy="0">NEXT STEP</tspan></text><text x="80" y="215" fill="#FFFFFF" font-family="Liberation Sans" font-size="51" font-weight="bold"><tspan x="80" dy="0">Prove the</tspan><tspan x="80" dy="59">business value</tspan><tspan x="80" dy="59">in your</tspan><tspan x="80" dy="59">environment.</tspan></text><text x="80" y="470" fill="#8FE3DA" font-family="Liberation Sans" font-size="26" font-weight="bold"><tspan x="80" dy="0">What the pilot covers</tspan></text><text x="80" y="516" fill="#FFFFFF" font-family="Liberation Sans" font-size="24" font-weight="normal"><tspan x="80" dy="0">Use-case flow and consumers</tspan><tspan x="80" dy="34.1">Topics and permissions</tspan><tspan x="80" dy="34.1">Outage cases to test</tspan><tspan x="80" dy="34.1">Enclave, model, records,</tspan><tspan x="80" dy="34.1">and recovery evidence</tspan></text><text x="660" y="105" fill="#102E43" font-family="Liberation Sans" font-size="42" font-weight="bold"><tspan x="660" dy="0">Staged proof of value</tspan></text><text x="660" y="166" fill="#526A78" font-family="Liberation Sans" font-size="27" font-weight="normal"><tspan x="660" dy="0">A short, staged pilot that proves three results.</tspan></text><text x="660" y="270" fill="#087F83" font-family="Liberation Sans" font-size="44" font-weight="bold"><tspan x="660" dy="0">01</tspan></text><text x="750" y="270" fill="#102E43" font-family="Liberation Sans" font-size="32" font-weight="bold"><tspan x="750" dy="0">Controlled access</tspan></text><text x="750" y="316" fill="#102E43" font-family="Liberation Sans" font-size="25" font-weight="normal"><tspan x="750" dy="0">Allowed and denied attempts match the permission plan</tspan></text><text x="750" y="354" fill="#526A78" font-family="Liberation Sans" font-size="23" font-weight="normal"><tspan x="750" dy="0">Evidence: test log and denial counts in Broker Manager</tspan></text><path d="M660 384H1520" fill="none" stroke="#B4C9CC" stroke-width="1" stroke-dasharray=""/><text x="660" y="440" fill="#087F83" font-family="Liberation Sans" font-size="44" font-weight="bold"><tspan x="660" dy="0">02</tspan></text><text x="750" y="440" fill="#102E43" font-family="Liberation Sans" font-size="32" font-weight="bold"><tspan x="750" dy="0">Fewer missed important alerts</tspan></text><text x="750" y="486" fill="#102E43" font-family="Liberation Sans" font-size="25" font-weight="normal"><tspan x="750" dy="0">Validate expected delivery in planned outage cases</tspan></text><text x="750" y="524" fill="#526A78" font-family="Liberation Sans" font-size="23" font-weight="normal"><tspan x="750" dy="0">Evidence: queue depth and delivery counts in Broker Manager and Insights</tspan></text><path d="M660 554H1520" fill="none" stroke="#B4C9CC" stroke-width="1" stroke-dasharray=""/><text x="660" y="610" fill="#087F83" font-family="Liberation Sans" font-size="44" font-weight="bold"><tspan x="660" dy="0">03</tspan></text><text x="750" y="610" fill="#102E43" font-family="Liberation Sans" font-size="32" font-weight="bold"><tspan x="750" dy="0">Less custom integration effort</tspan></text><text x="750" y="656" fill="#102E43" font-family="Liberation Sans" font-size="25" font-weight="normal"><tspan x="750" dy="0">Add a recipient via subscriptions and access rules</tspan></text><text x="750" y="694" fill="#526A78" font-family="Liberation Sans" font-size="23" font-weight="normal"><tspan x="750" dy="0">Evidence: change record, no producer changes; federal feasibility findings</tspan></text><path d="M660 724H1520" fill="none" stroke="#B4C9CC" stroke-width="1" stroke-dasharray=""/><text x="660" y="760" fill="#526A78" font-family="Liberation Sans" font-size="22" font-weight="normal"><tspan x="660" dy="0">Built-in monitoring in Broker Manager and Insights; can also feed an existing Grafana.</tspan></text><text x="660" y="812" fill="#087F83" font-family="Liberation Sans" font-size="23" font-weight="bold"><tspan x="660" dy="0">Stage 1 reuses today's demo. Later stages run in your approved environment.</tspan></text><text x="1468" y="856" fill="#526A78" font-family="Liberation Sans" font-size="22" font-weight="normal"><tspan x="1468" dy="0">10</tspan></text></svg>