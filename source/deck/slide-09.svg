<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="De-risking Agent Mesh in federal environments"><title>De-risking Agent Mesh in federal environments</title><defs><marker id="deck-arrow-9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#087F83"/></marker><marker id="deck-arrow-9-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#102E43"/></marker><marker id="deck-arrow-9-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#9A3B2E"/></marker></defs><rect x="0" y="0" width="1600" height="900" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2" stroke-dasharray=""/><text x="80" y="91" fill="#087F83" font-family="Liberation Sans" font-size="22" font-weight="bold"><tspan x="80" dy="0">ADOPTING AI SAFELY</tspan></text><text x="80" y="160" fill="#102E43" font-family="Liberation Sans" font-size="46" font-weight="bold"><tspan x="80" dy="0">De-risking Agent Mesh in federal environments</tspan></text><text x="80" y="219" fill="#526A78" font-family="Liberation Sans" font-size="26" font-weight="normal"><tspan x="80" dy="0">Three concerns federal teams raise, and how to address each.</tspan></text><rect x="80" y="250" width="480" height="50" rx="0" fill="#102E43" stroke="none" stroke-width="2" stroke-dasharray=""/><text x="102" y="284" fill="#FFFFFF" font-family="Liberation Sans" font-size="25" font-weight="bold"><tspan x="102" dy="0">Concern</tspan></text><rect x="560" y="250" width="480" height="50" rx="0" fill="#102E43" stroke="none" stroke-width="2" stroke-dasharray=""/><text x="582" y="284" fill="#FFFFFF" font-family="Liberation Sans" font-size="25" font-weight="bold"><tspan x="582" dy="0">Approach</tspan></text><rect x="1040" y="250" width="480" height="50" rx="0" fill="#102E43" stroke="none" stroke-width="2" stroke-dasharray=""/><text x="1062" y="284" fill="#FFFFFF" font-family="Liberation Sans" font-size="25" font-weight="bold"><tspan x="1062" dy="0">How to verify</tspan></text><rect x="80" y="300" width="1440" height="135" rx="0" fill="#F3F6F8" stroke="none" stroke-width="2" stroke-dasharray=""/><text x="102" y="333" fill="#087F83" font-family="Liberation Sans" font-size="23" font-weight="bold"><tspan x="102" dy="0">1  AI agent &amp; data boundary</tspan></text><text x="102" y="365" fill="#102E43" font-family="Liberation Sans" font-size="22" font-weight="normal"><tspan x="102" dy="0">AI agents and data must stay</tspan><tspan x="102" dy="26.8">within the approved boundary.</tspan></text><text x="582" y="333" fill="#102E43" font-family="Liberation Sans" font-size="22" font-weight="normal"><tspan x="582" dy="0">Approved private/local model;</tspan><tspan x="582" dy="26.8">restrict tools; inventory all</tspan><tspan x="582" dy="26.8">outbound dependencies.</tspan></text><text x="1062" y="333" fill="#102E43" font-family="Liberation Sans" font-size="22" font-weight="normal"><tspan x="1062" dy="0">Verify whole-system data flows,</tspan><tspan x="1062" dy="26.8">unauthorized access and</tspan><tspan x="1062" dy="26.8">outbound blocking.</tspan></text><path d="M80 435H1520" fill="none" stroke="#B4C9CC" stroke-width="1" stroke-dasharray=""/><rect x="80" y="435" width="1440" height="135" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2" stroke-dasharray=""/><text x="102" y="468" fill="#087F83" font-family="Liberation Sans" font-size="23" font-weight="bold"><tspan x="102" dy="0">2  Sensitive data &amp; official records</tspan></text><text x="102" y="500" fill="#102E43" font-family="Liberation Sans" font-size="22" font-weight="normal"><tspan x="102" dy="0">Conversations/files may be sensitive</tspan><tspan x="102" dy="26.8">or records with mandated retention;</tspan><tspan x="102" dy="26.8">some require permanent archives.</tspan></text><text x="582" y="468" fill="#102E43" font-family="Liberation Sans" font-size="22" font-weight="normal"><tspan x="582" dy="0">Customer retention schedule;</tspan><tspan x="582" dy="26.8">access by designation/classification;</tspan><tspan x="582" dy="26.8">customer controls for legal holds</tspan><tspan x="582" dy="26.8">and archival preservation.</tspan></text><text x="1062" y="468" fill="#102E43" font-family="Liberation Sans" font-size="22" font-weight="normal"><tspan x="1062" dy="0">Verify access and storage; validate</tspan><tspan x="1062" dy="26.8">retention, holds, archival</tspan><tspan x="1062" dy="26.8">preservation, backups and logs.</tspan></text><path d="M80 570H1520" fill="none" stroke="#B4C9CC" stroke-width="1" stroke-dasharray=""/><rect x="80" y="570" width="1440" height="135" rx="0" fill="#F3F6F8" stroke="none" stroke-width="2" stroke-dasharray=""/><text x="102" y="603" fill="#087F83" font-family="Liberation Sans" font-size="23" font-weight="bold"><tspan x="102" dy="0">3  Undo &amp; conflicting changes</tspan></text><text x="102" y="635" fill="#102E43" font-family="Liberation Sans" font-size="22" font-weight="normal"><tspan x="102" dy="0">Can actions be reversed? What if</tspan><tspan x="102" dy="26.8">two AI agents change the same</tspan><tspan x="102" dy="26.8">thing at the same time?</tspan></text><text x="582" y="603" fill="#102E43" font-family="Liberation Sans" font-size="22" font-weight="normal"><tspan x="582" dy="0">Human-in-the-loop before</tspan><tspan x="582" dy="26.8">irreversible actions; plan how to</tspan><tspan x="582" dy="26.8">reverse or correct each action;</tspan><tspan x="582" dy="26.8">coordinate conflicts.</tspan></text><text x="1062" y="603" fill="#102E43" font-family="Liberation Sans" font-size="22" font-weight="normal"><tspan x="1062" dy="0">Fully test race conditions and</tspan><tspan x="1062" dy="26.8">partial-completion failures;</tspan><tspan x="1062" dy="26.8">verify safe conflict handling,</tspan><tspan x="1062" dy="26.8">recovery and irreversible actions.</tspan></text><path d="M80 705H1520" fill="none" stroke="#B4C9CC" stroke-width="1" stroke-dasharray=""/><rect x="80" y="720" width="672" height="42" rx="8" fill="#EDF6F5" stroke="#087F83" stroke-width="2" stroke-dasharray=""/><text x="100" y="748" fill="#087F83" font-family="Liberation Sans" font-size="20" font-weight="bold"><tspan x="100" dy="0">In Demo 4, the agent only observes; delivery never depends on it.</tspan></text><text x="80" y="800" fill="#102E43" font-family="Liberation Sans" font-size="20" font-weight="normal"><tspan x="80" dy="0">Classified use requires an approved deployment with an ATO at that level.</tspan></text><g><path d="M80 819H1520" fill="none" stroke="#526A78" stroke-width="1" stroke-dasharray=""/><text x="1468" y="856" fill="#526A78" font-family="Liberation Sans" font-size="22" font-weight="normal"><tspan x="1468" dy="0">09</tspan></text></g></svg>